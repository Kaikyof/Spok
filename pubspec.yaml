name: spok
description: "Spok — оболочка над спекой разработки: состояние работы и запуск команд платформы."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  dio: ^5.11.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  get_it: ^9.2.1
  glob: ^2.2.0
  intl: ^0.20.3
  path: ^1.9.1
  url_launcher: ^6.3.2
  window_manager: ^0.5.2
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/openspec/schemas/spec-driven/schema.yaml
