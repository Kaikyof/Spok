# Прогон под Linux. На машинах разработки приложение собирается только под
# macOS, поэтому линуксовые ветки кода — раскладка XDG, запасное хранилище
# секретов, `xdg-open` — иначе не исполняются никогда. Анализ и тесты (в том
# числе ветка «keyring недоступен, значения уходят в файл 0600», которую на
# маке с Keychain не увидеть) гоняются на каждый PR/push в checks.yml —
# тоже на ubuntu-latest, так что то же безголовое окружение. Запуск GUI и
# работу с gnome-keyring проверяют руками на живой системе, CI их не
# заменяет.
#
# Триггер — только тег вида v*, а не каждый push/PR: пайплайн — релизный,
# собирает артефакт под версией, а не дублирует checks.yml
# (симметрично macos.yml, где так же).
#
# workflow_call — чтобы build.yml (кнопка «Run workflow» в Actions) мог
# вызвать эту сборку напрямую для только что созданного dev-тега, не
# дожидаясь отдельного push-события: GITHUB_TOKEN его не порождает
# (защита от рекурсии), поэтому цепочка «создали тег → он сам всё собрал»
# через push не работает без PAT. Вызов джобой из одного workflow-запуска
# этого не требует.

name: Linux

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

# Слот раннера общий: устаревший прогон по той же ветке отменяем, чтобы
# не занимать очередь ради результата, который уже никому не нужен.
concurrency:
  group: linux-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # По умолчанию GITHUB_TOKEN на приватном репозитории может быть
    # read-only; для публикации в Release нужно явно разрешить запись.
    permissions:
      contents: write

    # При обычном push тега github.ref_name уже равен тегу; при вызове из
    # build.yml тег приходит как input — единый TAG сверху устраняет
    # ветвление в шагах ниже.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # Полная история, а не shallow-клон по умолчанию: номер сборки ниже
      # считается по числу коммитов, с depth=1 их всегда было бы ровно 1.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # Версия прибита к той, на которой ведётся разработка: «последняя
      # stable» превращает чужой релиз Flutter в красный пайплайн у нас.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # Десктопная сборка Flutter под Linux тянет GTK и ninja; clang, cmake
      # и pkg-config в образе есть, но перечислены явно — образ меняется,
      # а ошибка от их отсутствия выглядит как непонятный сбой cmake.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Зависимости проекта
        run: flutter pub get

      # Число коммитов до текущего тега, а не github.run_number: у linux.yml
      # и macos.yml разные счётчики запусков, а число коммитов — свойство
      # исходников, одинаковое для обеих платформ на одном теге.
      - name: Номер сборки
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Анализ и тесты — в checks.yml на каждый PR/push; здесь, в релизном
      # прогоне по тегу, дублировать их незачем.
      - name: Сборка
        run: flutter build linux --release --build-number="$BUILD_NUMBER"

      # Артефакт GitHub Actions отдаётся только вместе с логом прогона —
      # чтобы скачать сборку, нужно искать нужный run. Release-ассет вместо
      # этого лежит на постоянной странице релиза по тегу и не истекает.
      - name: Архив сборки
        run: |
          mkdir -p dist
          (cd build/linux/x64/release/bundle && zip -r "$GITHUB_WORKSPACE/dist/spok-linux-x64-${TAG}.zip" .)

      # macos.yml публикует в тот же релиз (по тегу) свой DMG — действие
      # находит существующий релиз и дополняет его, а не создаёт новый.
      # tag_name — явно: при вызове через workflow_call github.ref_name
      # указывает на ветку-инициатор build.yml, а не на созданный тег.
      - name: Выложить в Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/spok-linux-x64-${{ env.TAG }}.zip
          fail_on_unmatched_files: true
