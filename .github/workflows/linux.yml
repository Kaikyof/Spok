# Прогон под Linux. На машинах разработки приложение собирается только под
# macOS, поэтому линуксовые ветки кода — раскладка XDG, запасное хранилище
# секретов, `xdg-open` — иначе не исполняются никогда.
#
# Раннер безголовый: окна нет, сеанса рабочего стола нет, D-Bus нет. Это не
# недостаток, а половина ценности — именно здесь проверяется ветка «keyring
# недоступен, значения уходят в файл 0600», которую на маке с Keychain
# не увидеть. Запуск GUI и работу с gnome-keyring проверяют руками
# на живой системе, CI их не заменяет.

name: Linux

on:
  pull_request:
  push:
    branches: [develop, main]

# Слот раннера общий: устаревший прогон по той же ветке отменяем, чтобы
# не занимать очередь ради результата, который уже никому не нужен.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Версия прибита к той, на которой ведётся разработка: «последняя
      # stable» превращает чужой релиз Flutter в красный пайплайн у нас.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # Десктопная сборка Flutter под Linux тянет GTK и ninja; clang, cmake
      # и pkg-config в образе есть, но перечислены явно — образ меняется,
      # а ошибка от их отсутствия выглядит как непонятный сбой cmake.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Зависимости проекта
        run: flutter pub get

      - name: Анализ
        run: flutter analyze

      # Те же тесты, что и на маке. Значение прогона здесь в том, что
      # ветки Platform.isLinux и запасное хранилище секретов впервые
      # выполняются по-настоящему.
      - name: Тесты
        run: flutter test

      - name: Сборка
        run: flutter build linux --release

      # Артефакт нужен для ручной проверки GUI: собранное приложение можно
      # скачать и запустить в виртуалке, не поднимая там среду сборки.
      - name: Выложить сборку
        uses: actions/upload-artifact@v4
        with:
          name: spok-linux-x64
          path: build/linux/x64/release/bundle
          retention-days: 7
          if-no-files-found: error
