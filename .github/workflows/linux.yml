# Прогон под Linux. На машинах разработки приложение собирается только под
# macOS, поэтому линуксовые ветки кода — раскладка XDG, запасное хранилище
# секретов, `xdg-open` — иначе не исполняются никогда. Анализ и тесты (в том
# числе ветка «keyring недоступен, значения уходят в файл 0600», которую на
# маке с Keychain не увидеть) гоняются на каждый PR/push в checks.yml —
# тоже на ubuntu-latest, так что то же безголовое окружение. Запуск GUI и
# работу с gnome-keyring проверяют руками на живой системе, CI их не
# заменяет.
#
# Триггер — только тег вида v*, а не каждый push/PR: пайплайн — релизный,
# собирает артефакт под версией, а не дублирует checks.yml
# (симметрично macos.yml, где так же).

name: Linux

on:
  push:
    tags: ["v*"]

# Слот раннера общий: устаревший прогон по той же ветке отменяем, чтобы
# не занимать очередь ради результата, который уже никому не нужен.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Версия прибита к той, на которой ведётся разработка: «последняя
      # stable» превращает чужой релиз Flutter в красный пайплайн у нас.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # Десктопная сборка Flutter под Linux тянет GTK и ninja; clang, cmake
      # и pkg-config в образе есть, но перечислены явно — образ меняется,
      # а ошибка от их отсутствия выглядит как непонятный сбой cmake.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Зависимости проекта
        run: flutter pub get

      # Анализ и тесты — в checks.yml на каждый PR/push; здесь, в релизном
      # прогоне по тегу, дублировать их незачем.
      - name: Сборка
        run: flutter build linux --release

      # Артефакт нужен для ручной проверки GUI: собранное приложение можно
      # скачать и запустить в виртуалке, не поднимая там среду сборки.
      - name: Выложить сборку
        uses: actions/upload-artifact@v4
        with:
          name: spok-linux-x64-${{ github.ref_name }}
          path: build/linux/x64/release/bundle
          retention-days: 7
          if-no-files-found: error
