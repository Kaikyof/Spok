# Кнопка «Run workflow» в Actions: тег для dev-сборки (v{версия}-dev.N)
# считается и пушится здесь же, без локального scripts/tag_dev_build.sh —
# полезно, когда нужна сборка, а под рукой нет git/доступа в терминал.
# version в pubspec.yaml не трогается — та же логика, что и в скрипте.
#
# linux.yml/macos.yml вызываются напрямую как под-джобы (workflow_call), а
# не через push тега: GITHUB_TOKEN не порождает push-событий для других
# workflow (защита от рекурсии), так что тег, запушенный им, сам по себе
# ничего бы не собрал.

name: Dev build

on:
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определить и запушить тег
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1)"
          PREFIX="v${VERSION}-dev."
          LAST_N="$(git tag -l "${PREFIX}*" | sed "s/^${PREFIX}//" | sort -n | tail -1)"
          NEXT_N=$(( ${LAST_N:-0} + 1 ))
          TAG="${PREFIX}${NEXT_N}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "==> $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: tag
    uses: ./.github/workflows/linux.yml
    # Вызывающая джоба ограничивает права вызванного workflow сверху —
    # без явного contents: write здесь linux.yml получил бы только read
    # и не смог бы опубликовать Release, даже указав write у себя.
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  build-macos:
    needs: tag
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
