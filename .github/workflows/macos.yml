# Прогон под macOS — платформой, на которой ведётся разработка и куда
# целится основная сборка. В отличие от linux.yml, здесь не воссоздаётся
# незнакомая среда: раннер уже содержит Xcode и CocoaPods, поэтому шага
# системных зависимостей нет.
#
# Триггер — только тег вида v*, а не каждый push/PR: репозиторий приватный,
# а macOS-раннер списывает минуты с множителем ×10 к обычным (Linux — ×1).
# Оба пайплайна (macOS и linux.yml) теперь релизные: собирают артефакт под
# тегом версии. Анализ и тесты на каждый коммит — в checks.yml.
#
# App Sandbox отключён (macos/Runner/Release.entitlements), поэтому сборка
# для CI не требует profile для подписи: Xcode подписывает бинарник ad-hoc
# автоматически. Тесты используют SecretStore.inFile и в реальную связку
# ключей раннера не пишут.

name: macOS

on:
  push:
    tags: ["v*"]

# Слот раннера общий: устаревший прогон по той же ветке отменяем, чтобы
# не занимать очередь ради результата, который уже никому не нужен.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    # По умолчанию GITHUB_TOKEN на приватном репозитории может быть
    # read-only; для публикации в Release нужно явно разрешить запись.
    permissions:
      contents: write

    steps:
      # Полная история, а не shallow-клон по умолчанию: номер сборки ниже
      # считается по числу коммитов, с depth=1 их всегда было бы ровно 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Версия прибита к той, на которой ведётся разработка: «последняя
      # stable» превращает чужой релиз Flutter в красный пайплайн у нас.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Зависимости проекта
        run: flutter pub get

      # Число коммитов до текущего тега, а не github.run_number: у linux.yml
      # и macos.yml разные счётчики запусков, а число коммитов — свойство
      # исходников, одинаковое для обеих платформ на одном теге.
      - name: Номер сборки
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Анализ и тесты — в checks.yml на каждый PR/push (там же дешёвый
      # ubuntu-latest); здесь, в релизном прогоне по тегу, дублировать
      # их незачем.
      - name: Сборка
        run: flutter build macos --release --build-number="$BUILD_NUMBER"

      # Упаковка в DMG тем же скриптом, что и для ручного релиза — CI и
      # разработчик получают идентичный артефакт. --skip-build: .app уже
      # собран шагом выше, пересобирать его ещё раз незачем.
      # CODESIGN_IDENTITY не задан: сертификата Developer ID в CI нет,
      # скрипт сам оставляет ad-hoc подпись Xcode — как и при обычной
      # локальной сборке без переменной.
      - name: Упаковка DMG
        run: ./scripts/build_dmg.sh --skip-build

      # Артефакт GitHub Actions отдаётся только вместе с логом прогона —
      # чтобы скачать сборку, нужно искать нужный run. Release-ассет вместо
      # этого лежит на постоянной странице релиза по тегу и не истекает.
      # linux.yml публикует в тот же релиз (по тегу) свой zip — действие
      # находит существующий релиз и дополняет его, а не создаёт новый.
      - name: Выложить в Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
