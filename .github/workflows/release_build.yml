# Кнопка «Run workflow» в Actions: релизный тег v{version из pubspec.yaml},
# без -dev.N — считается и пушится здесь же, без ручного
# `git tag vX.Y.Z && git push origin vX.Y.Z`.
#
# В отличие от dev_build.yml номер тут не подбирается автоинкрементом:
# версия должна быть поднята в pubspec.yaml заранее (это и есть релизное
# решение — что именно версия релиза). Если тег с этой версией уже
# существует, шаг падает явной ошибкой, а не тихо перезаписывает релиз.
#
# linux.yml/macos.yml вызываются напрямую как под-джобы (workflow_call), а
# не через push тега: GITHUB_TOKEN не порождает push-событий для других
# workflow (защита от рекурсии), так что тег, запушенный им, сам по себе
# ничего бы не собрал.

name: Release build

on:
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определить и запушить тег
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1)"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Тег ${TAG} уже существует — поднимите version в pubspec.yaml перед релизом."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "==> $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: tag
    uses: ./.github/workflows/linux.yml
    # Вызывающая джоба ограничивает права вызванного workflow сверху —
    # без явного contents: write здесь linux.yml получил бы только read
    # и не смог бы опубликовать Release, даже указав write у себя.
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}

  build-macos:
    needs: tag
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
